name: Deploy Firebase Hosting preview on pull request

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          VITE_AGENT_API_URL: ${{ secrets.VITE_AGENT_API_URL }}
          VITE_AI_PROVIDER: ${{ secrets.VITE_AI_PROVIDER }}
          VITE_FIREBASE_AI_MODEL: ${{ secrets.VITE_FIREBASE_AI_MODEL }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_FIREBASE_API_KEY: AIzaSyD-TNDUpQr0KWWZae4ovZl6Gru-SOFwHbM
          VITE_FIREBASE_AUTH_DOMAIN: project-notes-62970.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: project-notes-62970
          VITE_FIREBASE_STORAGE_BUCKET: project-notes-62970.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: 374600304834
          VITE_FIREBASE_APP_ID: 1:374600304834:web:0a4f2669acb219395bd35b
          VITE_FIREBASE_VAPID_KEY: ${{ secrets.VITE_FIREBASE_VAPID_KEY }}
          VITE_FIREBASE_APPCHECK_RECAPTCHA_ENTERPRISE_SITE_KEY: ${{ secrets.VITE_FIREBASE_APPCHECK_RECAPTCHA_ENTERPRISE_SITE_KEY }}

      - name: Deploy Firebase Hosting preview
        run: npx firebase-tools@latest hosting:channel:deploy pr-${{ github.event.pull_request.number }} --expires 7d --project project-notes-62970
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
