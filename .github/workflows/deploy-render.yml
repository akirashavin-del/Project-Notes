name: Deploy Project Notebook to Render

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'src/**'
      - 'Dockerfile'
      - 'render.yaml'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-render.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Trigger ADK service deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_ADK_SERVICE_ID: ${{ secrets.RENDER_ADK_SERVICE_ID }}
        run: >-
          curl --fail --silent --show-error
          --request POST
          --header "Authorization: Bearer ${RENDER_API_KEY}"
          --header "Content-Type: application/json"
          --data '{"clearCache":"do_not_clear"}'
          "https://api.render.com/v1/services/${RENDER_ADK_SERVICE_ID}/deploys"
      - name: Trigger API service deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_API_SERVICE_ID: ${{ secrets.RENDER_API_SERVICE_ID }}
        run: >-
          curl --fail --silent --show-error
          --request POST
          --header "Authorization: Bearer ${RENDER_API_KEY}"
          --header "Content-Type: application/json"
          --data '{"clearCache":"do_not_clear"}'
          "https://api.render.com/v1/services/${RENDER_API_SERVICE_ID}/deploys"
